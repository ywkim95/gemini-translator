<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="container">
    <div class="header">
      Sidekick Translator
      <div class="width-controls">
        <button id="btn-width-small" data-width="300">Small</button>
        <button id="btn-width-medium" data-width="600">Medium</button>
        <button id="btn-width-large" data-width="900">Large</button>
      </div>
      <button id="export-btn" class="export-btn" style="display:none;">📁 파일로 저장</button>
      <button id="analyze-btn" class="analyze-btn">요약/번역</button>
      <button id="close-sidebar-btn" class="close-btn">&times;</button>
    </div>
    <!-- Tab Navigation -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="summary">📝 요약</button>
      <button class="tab-btn" data-tab="full">📄 전체 번역</button>
    </div>

    <!-- Summary Tab Content -->
    <div id="summary-tab" class="tab-content active">
      <div id="st-loading-state-summary" class="state-view" style="display:none;">
        <div class="spinner"></div>
        <p>요약을 생성 중입니다...</p>
      </div>
      <div id="st-result-state-summary" class="state-view" style="display:none;">
        <div class="section">
          <div id="st-summary"></div>
        </div>
      </div>
      <div id="st-error-state-summary" class="state-view" style="display:none;">
        <p id="st-error-message-summary"></p>
      </div>
    </div>

    <!-- Full Translation Tab Content -->
    <div id="full-tab" class="tab-content">
      <div id="st-loading-state-full" class="state-view" style="display:none;">
        <div class="spinner"></div>
        <p>전체 번역을 진행 중입니다...</p>
      </div>
      <div id="st-result-state-full" class="state-view" style="display:none;">
        <div class="section">
          <div id="st-translation"></div>
        </div>
      </div>
      <div id="st-error-state-full" class="state-view" style="display:none;">
        <p id="st-error-message-full"></p>
      </div>
    </div>
  </div>
  
  <!-- Toast 메시지 -->
  <div id="toast-container" style="display: none;">
    <div id="toast-message">
      <span id="toast-icon"></span>
      <span id="toast-text"></span>
    </div>
  </div>
  
  <script src="/scripts/showdown.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
